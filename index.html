<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario & Garfield Arcade Vault</title>
  <!-- CSV Parser Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      background-color: #0e0e17;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    h1 {
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #181826;
      border: 2px solid #ff0055;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
    }
    .card h3 {
      margin: 0 0 10px;
      color: #ffffff;
      font-size: 1.1rem;
    }
    .platform {
      color: #ffcc00;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>ARCADE GAME DATABASE</h1>
  <div class="grid" id="game-list">Loading games...</div>

  <script>
    // Reads vgsales.csv from your repository
    fetch('vgsales.csv')
      .then(res => res.text())
      .then(csvData => {
        Papa.parse(csvData, {
          header: true,
          complete: (results) => {
            const container = document.getElementById('game-list');
            container.innerHTML = '';
            
            // Filters only games with "Mario" or "Garfield" in the name
            const filtered = results.data.filter(game => 
              game.Name && /Mario|Garfield/i.test(game.Name)
            );

            filtered.forEach(game => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <h3>${game.Name}</h3>
                <p>Platform: <span class="platform">${game.Platform}</span></p>
                <p>Global Sales: ${game.Global_Sales}M</p>
              `;
              container.appendChild(card);
            });
          }
        });
      });
  </script>

</body>
</html>
