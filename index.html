<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Game Vault</title>
  <style>
    body {
      background-color: #0e0e17;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 0;
      margin: 0;
    }
    .header {
      position: sticky;
      top: 0;
      background: #141422;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #ff0055;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
    }
    h1 {
      color: #ff0055;
      margin: 0 0 10px 0;
      text-shadow: 0 0 10px #ff0055;
    }
    button {
      background-color: #ff0055;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff0055;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #ff2a75;
      transform: scale(1.05);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .card {
      background: #181826;
      border: 2px solid #33334d;
      border-radius: 8px;
      padding: 15px;
      transition: all 0.3s ease;
    }
    .card h3 {
      margin: 0 0 10px;
      color: #ffffff;
      font-size: 1rem;
    }
    .platform {
      color: #ffcc00;
      font-weight: bold;
    }
    .card.selected {
      border-color: #00ffcc;
      box-shadow: 0 0 25px #00ffcc;
      transform: scale(1.08);
      background: #1f2738;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ARCADE GAME DATABASE</h1>
    <button onclick="pickRandomGame()">🎲 PICK RANDOM GAME</button>
  </div>

  <div class="grid" id="game-list"></div>

  <script>
    // Embedded game list (Runs natively without fetching external files)
    const games = [
      { name: "Super Mario Bros.", platform: "NES", sales: "40.24M" },
      { name: "Mario Kart 8 Deluxe", platform: "Switch", sales: "52.00M" },
      { name: "Garfield Kart", platform: "3DS", sales: "0.15M" },
      { name: "Garfield Kart: Furious Racing", platform: "PC", sales: "0.42M" },
      { name: "Super Mario World", platform: "SNES", sales: "20.61M" },
      { name: "Super Mario 64", platform: "N64", sales: "11.89M" },
      { name: "Mario Kart Wii", platform: "Wii", sales: "35.82M" },
      { name: "New Super Mario Bros.", platform: "DS", sales: "29.80M" },
      { name: "Super Mario Odyssey", platform: "Switch", sales: "25.76M" },
      { name: "Pac-Man", platform: "Arcade", sales: "10.00M" },
      { name: "Space Invaders", platform: "Arcade", sales: "6.00M" },
      { name: "Donkey Kong", platform: "Arcade", sales: "5.50M" },
      { name: "Street Fighter II", platform: "Arcade", sales: "6.30M" },
      { name: "Mortal Kombat", platform: "Arcade", sales: "3.00M" },
      { name: "Galaga", platform: "Arcade", sales: "4.50M" },
      { name: "Asteroids", platform: "Arcade", sales: "4.30M" }
    ];

    const container = document.getElementById('game-list');

    // Display games immediately
    games.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `game-${index}`;
      card.innerHTML = `
        <h3>${game.name}</h3>
        <p>Platform: <span class="platform">${game.platform}</span></p>
        <p>Sales: ${game.sales}</p>
      `;
      container.appendChild(card);
    });

    function pickRandomGame() {
      const prev = document.querySelector('.card.selected');
      if (prev) prev.classList.remove('selected');

      const randomIndex = Math.floor(Math.random() * games.length);
      const card = document.getElementById(`game-${randomIndex}`);

      if (card) {
        card.classList.add('selected');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  </script>

</body>
</html>
