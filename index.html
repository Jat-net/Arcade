<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playable Arcade Vault</title>
  <style>
    body {
      background-color: #0e0e17;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
      margin: 0 0 10px 0;
    }
    button {
      background-color: #ff0055;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff0055;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #ff2a75;
      transform: scale(1.05);
    }
    .player-container {
      max-width: 800px;
      margin: 0 auto 30px auto;
      background: #141422;
      border: 2px solid #ff0055;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      border-radius: 6px;
      background: #000;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .card {
      background: #181826;
      border: 2px solid #33334d;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: #00f0ff;
      transform: translateY(-3px);
    }
    .card h3 {
      margin: 0 0 10px 0;
      color: #fff;
      font-size: 1rem;
    }
    .card.selected {
      border-color: #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
      background: #1f2738;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PLAYABLE ARCADE VAULT</h1>
    <button onclick="pickRandomGame()">🎲 PLAY RANDOM GAME</button>
  </div>

  <div class="player-container">
    <h2 id="current-title" style="color: #fff; margin-top: 5px;">Select a Game Below</h2>
    <iframe id="game-frame" src="about:blank"></iframe>
  </div>

  <div class="grid" id="game-list"></div>

  <script>
    // Embedded playable web-ports & emulated arcade entries
    const playableGames = [
      { name: "Super Mario Bros.", url: "https://minigames.mail.ru/" }, 
      { name: "Pac-Man Arcade", url: "https://freepacman.org/" },
      { name: "Street Fighter II", url: "https://retrogames.cc/" },
      { name: "Donkey Kong Classic", url: "https://free80sarcade.com/" }
    ];

    // Repositories dedicated to hosting thousands of playable games directly:
    // Search GitHub for: "EmulatorJS", "webretro", or "html5-games-repo"

    const container = document.getElementById('game-list');

    playableGames.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `game-${index}`;
      card.innerHTML = `<h3>${game.name}</h3><p style="color: #ffcc00; margin: 0;">Click to Play</p>`;
      card.onclick = () => loadGame(index);
      container.appendChild(card);
    });

    function loadGame(index) {
      const prev = document.querySelector('.card.selected');
      if (prev) prev.classList.remove('selected');

      const card = document.getElementById(`game-${index}`);
      card.classList.add('selected');

      document.getElementById('current-title').innerText = playableGames[index].name;
      document.getElementById('game-frame').src = playableGames[index].url;
    }

    function pickRandomGame() {
      const randomIndex = Math.floor(Math.random() * playableGames.length);
      loadGame(randomIndex);
    }
  </script>

</body>
</html>
